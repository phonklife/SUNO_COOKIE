name: CI

on:
  push:
    branches: [main, agent/bootstrap-suno-cookie]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Test
        run: npm test

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check SunoAPI Edge Function
        run: deno check --config supabase/functions/suno-upload-extend/deno.json supabase/functions/suno-upload-extend/index.ts supabase/functions/suno-upload-extend/index_test.ts

      - name: Test SunoAPI request validation
        run: deno test --config supabase/functions/suno-upload-extend/deno.json supabase/functions/suno-upload-extend/index_test.ts
